name: ASS 字幕拼写与术语检查（提醒）

# 在 PR 改动的 .ass 文件中检查常见拼写和术语不一致，发布/更新汇总性评论（提醒，不阻止合并）。

on:
  pull_request:
    paths: ['**.ass']

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 检查 .ass 中的拼写与术语
        id: check
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          git -c core.quotePath=false diff --unified=0 "$base...$head" -- '*.ass' \
            | python tools/check_ass_spelling.py --diff

      - name: 发布/更新/删除 PR 提醒评论
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- ass-spell-check -->';
            const count = parseInt('${{ steps.check.outputs.count }}' || '0', 10);
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.paginate(
              github.rest.issues.listComments, { owner, repo, issue_number });
            const mine = comments.find(c => c.body && c.body.includes(marker));

            if (count > 0) {
              const body = fs.readFileSync('ass_spell_comment.md', 'utf8');
              if (mine) {
                await github.rest.issues.updateComment(
                  { owner, repo, comment_id: mine.id, body });
              } else {
                await github.rest.issues.createComment(
                  { owner, repo, issue_number, body });
              }
            } else if (mine) {
              await github.rest.issues.deleteComment(
                { owner, repo, comment_id: mine.id });
            }
